[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lecture-notes"
version = "0.1.0"
description = "Faithful, cited Obsidian notes from any video lecture: timestamped transcripts, key frames, and a checker."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pillow>=10", "imagehash>=4.3", "yt-dlp[default]>=2025.1"]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]
ru = ["onnx-asr[cpu,hub]>=0.10"]
whisper = ["faster-whisper>=1.1", "numpy", "nvidia-ml-py>=12"]

[project.scripts]
lecture-notes = "lecture_notes.cli:main"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: runs real backends (model download, TTS); opt in with -m slow"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "ctranslate2.*", "numpy.*", "imagehash.*", "yt_dlp.*", "pynvml.*", "pytesseract.*", "onnx_asr.*"]
ignore_missing_imports = true
