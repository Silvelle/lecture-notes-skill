[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lecture-notes"
version = "0.1.0"
description = "Turn video lectures into faithful, timestamped Lecture bundles for humans and agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pillow>=10", "imagehash>=4.3", "yt-dlp[default]>=2025.1"]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.1", "numpy"]

[project.scripts]
lecture-notes = "lecture_notes.cli:main"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: runs real backends (model download, TTS); opt in with -m slow"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "ctranslate2.*", "numpy.*", "imagehash.*", "yt_dlp.*"]
ignore_missing_imports = true
