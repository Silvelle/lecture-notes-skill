name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fontconfig fonts-dejavu-core tesseract-ocr tesseract-ocr-eng
      - run: python -m pip install --upgrade pip && pip install -e '.[ocr]' --group dev
      - run: mypy
      - run: pytest

  slow:
    # Real faster-whisper on a fixture with synthesised speech; downloads a model, so not on PRs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fontconfig fonts-dejavu-core espeak-ng
      - run: python -m pip install --upgrade pip && pip install -e '.[whisper,ru]' --group dev
      - run: pytest -m slow

  package:
    # The built wheel installs into a clean venv and runs, on every OS the CLI supports.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - if: runner.os == 'macOS'
        run: brew install ffmpeg
      - if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: python -m pip install --upgrade pip build && python -m build
      - run: python -m venv "$RUNNER_TEMP/clean"
      - run: |
          bin="$RUNNER_TEMP/clean/bin"; [ -d "$RUNNER_TEMP/clean/Scripts" ] && bin="$RUNNER_TEMP/clean/Scripts"
          "$bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$bin/lecture-notes" --help
          "$bin/lecture-notes" doctor
